rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: No brand assets submitted to home-assistant/brands yet.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the API client lives in api.py.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: Entities only read coordinator data; no event subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service; nothing to discover on the network.
  discovery-update-info:
    status: exempt
    comment: Cloud service; nothing to discover on the network.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Cloud service account, not a device.
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry is one line; nothing is added dynamically.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Failures surface through ConfigEntryAuthFailed and entity availability.
  stale-devices:
    status: exempt
    comment: One config entry is one line; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
